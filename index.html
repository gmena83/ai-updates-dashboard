<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menatech AI Impact Dashboard</title>

      name="description"

    <meta property="og:title" content="Menatech AI Impact Dashboard" />
